<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the bottom action bar clears the iPhone home
         indicator; maximum-scale=1 stops iOS from zooming the page on input
         focus (inputs are also set to >=16px for the same reason). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#050509" />
    <meta name="color-scheme" content="dark light" />
    <!-- `ws:` (host-agnostic) is required: in dev this page is served by Vite
         on :5173 while the control socket listens on :8787, so 'self' would
         not cover it. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <title>KOG Worship Remote</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; min-height: 100%;
        background: #050509; color: #fff;
        font-family: 'Inter Variable', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mobile/main.jsx"></script>
  </body>
</html>
