name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # NOTE: no step bundles GEMINI_API_KEY into the installer, and
      # package.json must never list .env in extraResources. The installer is
      # published as a public release asset, so any secret packed inside it is
      # readable by anyone who downloads it. Smart Paste instead reads the
      # operator's own key from userData\.env (set in the song editor) and
      # falls back to local Ollama / regex when none is set.

      - name: Verify bundled backgrounds are present
        run: |
          if (-not (Test-Path "VideBackground")) { Write-Error "VideBackground folder missing — builtin videos would not ship"; exit 1 }
          if (-not (Test-Path "Photos")) { Write-Error "Photos folder missing — builtin photos would not ship"; exit 1 }
          $v = (Get-ChildItem "VideBackground" -File | Measure-Object).Count
          $p = (Get-ChildItem "Photos" -File | Measure-Object).Count
          Write-Host "Bundled backgrounds: $v videos, $p photos"
          if ($v -eq 0 -or $p -eq 0) { Write-Error "One of the background folders is empty"; exit 1 }

      - name: Build & Package
        run: npm run dist
        env:
          ELECTRON_CACHE: ~/.cache/electron
          electron_config_cache: ~/.cache/electron

      - name: Debug release directory
        run: |
          dir release\
          echo "---- latest.yml ----"
          type release\latest.yml

      - name: Verify installer embeds the backgrounds
        run: |
          $out = Get-ChildItem "release\win-unpacked\resources" -ErrorAction SilentlyContinue
          if (-not $out) { Write-Host "win-unpacked not present (ok for publish-only runs)"; exit 0 }
          foreach ($d in @("builtin-videos", "builtin-photos")) {
            if (-not (Test-Path "release\win-unpacked\resources\$d")) { Write-Error "$d was NOT embedded in the package"; exit 1 }
            $n = (Get-ChildItem "release\win-unpacked\resources\$d" -File | Measure-Object).Count
            Write-Host "Embedded ${d}: $n file(s)"
          }

      - name: Delete old release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No existing release to delete" }
          exit 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
