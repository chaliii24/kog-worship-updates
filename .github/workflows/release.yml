name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # NOTE: no step bundles GEMINI_API_KEY into the installer, and
      # package.json must never list .env in extraResources. The installer is
      # published as a public release asset, so any secret packed inside it is
      # readable by anyone who downloads it. Smart Paste parses locally with
      # the Regex engine by default; Gemini AI Auto-Fix reads the operator's
      # own key from userData\.env (set in the song editor) and never runs
      # unless explicitly clicked.

      # House backgrounds are pure CSS (7 static + 7 animated gradients, zero
      # installer bytes), so there are no bundled media folders to verify. The
      # counts below guard the catalogs against accidental trims instead.

      - name: Verify gradient catalogs are complete
        run: |
          $g = (Select-String -Path "src/lib/backgrounds.js" -Pattern "id: 'g-" | Measure-Object).Count
          Write-Host "Static gradients: $g"
          if ($g -ne 7) { Write-Error "GRADIENT_PACK must hold exactly 7 (found $g)"; exit 1 }
          $a = (Select-String -Path "src/components/CountdownFace.jsx" -Pattern 'blobs: \[' | Measure-Object).Count
          Write-Host "Animated gradients: $a"
          if ($a -ne 7) { Write-Error "ANIMATED_GRADIENTS must hold exactly 7 (found $a)"; exit 1 }

      - name: Build & Package
        run: npm run dist
        env:
          ELECTRON_CACHE: ~/.cache/electron
          electron_config_cache: ~/.cache/electron

      - name: Debug release directory
        run: |
          dir release\
          echo "---- latest.yml ----"
          type release\latest.yml

      - name: Verify no bundled media ships
        run: |
          $out = Get-ChildItem "release\win-unpacked\resources" -ErrorAction SilentlyContinue
          if (-not $out) { Write-Host "win-unpacked not present (ok for publish-only runs)"; exit 0 }
          foreach ($d in @("builtin-videos", "builtin-photos")) {
            if (Test-Path "release\win-unpacked\resources\$d") { Write-Error "$d must NOT ship anymore — house gradients replaced it"; exit 1 }
          }
          Write-Host "No bundled media folders — installer stays lean"

      - name: Delete old release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ github.ref_name }} --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No existing release to delete" }
          exit 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          name: ${{ github.ref_name }} Beta
          generate_release_notes: true
          draft: false
          prerelease: false
