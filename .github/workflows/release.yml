name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build & Package
        run: npm run dist
        env:
          ELECTRON_CACHE: ~/.cache/electron
          electron_config_cache: ~/.cache/electron

      - name: Debug release directory
        run: |
          dir release\
          echo "---- latest.yml ----"
          type release\latest.yml

      - name: Delete old release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ github.ref_name }} --yes --cleanup-tag 2>$null; if ($LASTEXITCODE -ne 0) { echo "No existing release to delete" }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
